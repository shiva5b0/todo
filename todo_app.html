
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --app-bg:#F5F3EE;
    --card-bg:#FFFFFF;
    --accent:#5B7FFF;
    --accent-light:#EEF1FF;
    --done-color:#9CA3AF;
    --text-primary:#1A1A2E;
    --text-secondary:#6B7280;
    --border:#E5E7EB;
    --danger:#FCA5A5;
    --danger-dark:#EF4444;
    --success:#6EE7B7;
    --radius:14px;
    --shadow:0 2px 12px rgba(91,127,255,0.08);
  }
  body{font-family:'DM Sans',sans-serif;background:var(--app-bg);min-height:100vh;display:flex;justify-content:center;padding:32px 16px 64px;color:var(--text-primary)}
  .app{width:100%;max-width:560px}
  .header{text-align:center;margin-bottom:28px}
  .header h1{font-size:28px;font-weight:600;letter-spacing:-0.5px;color:var(--text-primary)}
  .header p{font-size:14px;color:var(--text-secondary);margin-top:4px}
  .input-card{background:var(--card-bg);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;gap:10px;margin-bottom:20px;border:1px solid var(--border)}
  .input-card input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text-primary);background:transparent}
  .input-card input::placeholder{color:#C4C9D4}
  .add-btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:0 18px;height:40px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background 0.15s,transform 0.1s}
  .add-btn:hover{background:#4A6EEE}
  .add-btn:active{transform:scale(0.97)}
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .filter-btn{background:var(--card-bg);border:1px solid var(--border);border-radius:20px;padding:6px 16px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .filter-btn:hover:not(.active){border-color:var(--accent);color:var(--accent)}
  .stats{font-size:13px;color:var(--text-secondary);margin-left:auto;align-self:center}
  .task-list{display:flex;flex-direction:column;gap:8px}
  .task-item{background:var(--card-bg);border-radius:var(--radius);border:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);animation:slideIn 0.2s ease;transition:opacity 0.2s,transform 0.2s}
  @keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .task-item.done{opacity:0.6}
  .task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;background:transparent}
  .task-check:hover{border-color:var(--accent)}
  .task-check.checked{background:var(--accent);border-color:var(--accent)}
  .task-check.checked svg{display:block}
  .task-check svg{display:none;width:12px;height:12px}
  .task-text{flex:1;font-size:15px;line-height:1.4;transition:color 0.15s}
  .task-item.done .task-text{text-decoration:line-through;color:var(--done-color)}
  .task-edit-input{flex:1;border:none;outline:none;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text-primary);background:transparent;border-bottom:2px solid var(--accent);padding-bottom:2px}
  .task-actions{display:flex;gap:4px;opacity:0;transition:opacity 0.15s}
  .task-item:hover .task-actions{opacity:1}
  .icon-btn{width:32px;height:32px;border:none;border-radius:8px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s;color:var(--text-secondary)}
  .icon-btn:hover.edit{background:var(--accent-light);color:var(--accent)}
  .icon-btn:hover.del{background:#FEF2F2;color:var(--danger-dark)}
  .save-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer}
  .empty{text-align:center;padding:40px 0;color:var(--text-secondary)}
  .empty-icon{font-size:36px;margin-bottom:8px}
  .empty p{font-size:14px}
  .progress-bar{height:4px;background:var(--border);border-radius:4px;margin-bottom:20px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),#7C9FFF);border-radius:4px;transition:width 0.4s ease}
  .tag{font-size:11px;font-weight:500;background:var(--accent-light);color:var(--accent);border-radius:6px;padding:2px 8px;font-family:'DM Mono',monospace}
</style>

<div class="app">
  <div class="header">
    <h1>My tasks</h1>
    <p id="dateLabel"></p>
  </div>

  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="input-card">
    <input type="text" id="taskInput" placeholder="Add a new task…" maxlength="120" />
    <button class="add-btn" onclick="addTask()">+ Add</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active',this)">Active</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done',this)">Completed</button>
    <span class="stats" id="stats"></span>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<script>
  const STORE_KEY = 'todo_tasks_v1';
  let tasks = [];
  let filter = 'all';
  let editingId = null;

  try { tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch(e) { tasks = []; }

  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); } catch(e){} }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  function setFilter(f, btn) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    tasks.unshift({ id: uid(), text, done: false, created: Date.now() });
    input.value = '';
    save();
    filter = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
    render();
    input.focus();
  }

  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    const el = document.getElementById('task-' + id);
    if (el) { el.style.opacity = '0'; el.style.transform = 'translateX(20px)'; }
    setTimeout(() => { tasks = tasks.filter(t => t.id !== id); save(); render(); }, 180);
  }

  function startEdit(id) {
    editingId = id;
    render();
    const inp = document.getElementById('edit-' + id);
    if (inp) { inp.focus(); inp.select(); }
  }

  function saveEdit(id) {
    const inp = document.getElementById('edit-' + id);
    if (!inp) return;
    const val = inp.value.trim();
    if (val) { const t = tasks.find(t => t.id === id); if(t) t.text = val; }
    editingId = null;
    save();
    render();
  }

  function render() {
    const list = document.getElementById('taskList');
    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    document.getElementById('stats').textContent = active + ' remaining';
    document.getElementById('progressFill').style.width = total ? Math.round(done/total*100) + '%' : '0%';

    const visible = tasks.filter(t => filter === 'all' ? true : filter === 'done' ? t.done : !t.done);

    if (!visible.length) {
      const msgs = { all: ['Nothing here yet', 'Add your first task above!'], active: ['All done!', "You've completed everything."], done: ['No completed tasks', 'Finish some tasks first.'] };
      const [icon, msg] = filter === 'done' ? ['✓','No completed tasks yet'] : filter === 'active' && done === total && total > 0 ? ['🎉','All tasks complete!'] : ['📝','Add your first task above!'];
      list.innerHTML = `<div class="empty"><div class="empty-icon">${filter==='active'&&total>0?'🎉':'📝'}</div><p>${filter==='active'&&total>0?'All done! Great work.':filter==='done'?'No completed tasks yet.':'Nothing here yet — add a task above!'}</p></div>`;
      return;
    }

    list.innerHTML = visible.map(t => {
      const isEditing = editingId === t.id;
      return `<div class="task-item${t.done?' done':''}" id="task-${t.id}">
        <div class="task-check${t.done?' checked':''}" onclick="toggleDone('${t.id}')">
          <svg viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2,6 5,9 10,3"/></svg>
        </div>
        ${isEditing
          ? `<input class="task-edit-input" id="edit-${t.id}" value="${t.text.replace(/"/g,'&quot;')}" onkeydown="if(event.key==='Enter')saveEdit('${t.id}');if(event.key==='Escape'){editingId=null;render();}" /><button class="save-btn" onclick="saveEdit('${t.id}')">Save</button>`
          : `<span class="task-text">${escHtml(t.text)}</span>
             <div class="task-actions">
               <button class="icon-btn edit" title="Edit" onclick="startEdit('${t.id}')">
                 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
               </button>
               <button class="icon-btn del" title="Delete" onclick="deleteTask('${t.id}')">
                 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
               </button>
             </div>`
        }
      </div>`;
    }).join('');
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  document.getElementById('taskInput').addEventListener('keydown', e => { if(e.key === 'Enter') addTask(); });

  const now = new Date();
  document.getElementById('dateLabel').textContent = now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

  render();
</script>
